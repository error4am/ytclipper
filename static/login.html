<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytclipper · sign in</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="12" y="10" width="3" height="12" fill="currentColor"/>
        <rect x="18" y="10" width="3" height="12" fill="currentColor"/>
      </svg>
      <span>yt<em>clipper</em></span>
    </div>
    <p class="muted">
      This dashboard can start streams and delete files, so it is locked.
      Enter the password you set with <code>--password</code>.
    </p>
    <input id="password" type="password" name="password" placeholder="password"
           autocomplete="current-password" required autofocus>
    <button class="go" type="submit">unlock</button>
    <p class="login-error" id="login-error"></p>
  </form>
  <script src="/static/login.js"></script>
</body>
</html>
